<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>加密簡報</title><style>body{margin:0;background:#f3f4f5;color:#1b2533;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{box-sizing:border-box;width:min(90vw,460px);padding:32px;border-top:4px solid #002fa7}h1{font-size:30px;font-weight:400;margin:0 0 8px}p{color:#5a6674}label{display:block;margin-top:24px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #adb8c6;background:white}button{margin-top:16px;padding:11px 23px;font:inherit;color:white;background:#002fa7;border:0;cursor:pointer}button:disabled{opacity:.6}#message{min-height:1.6em;color:#9b1829}</style></head><body><main><h1>私人簡報</h1><p>請輸入分享者提供的密碼，以開啟簡報。</p><form><label for="password">密碼</label><input type="password" id="password" autocomplete="current-password" required><button type="submit">開啟簡報</button><p id="message" role="status"></p></form></main><script>
const form=document.querySelector('form'),field=document.querySelector('#password'),message=document.querySelector('#message'),button=document.querySelector('button');
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
let meta;async function loadMeta(){return meta ||= await (await fetch('meta.json')).json()}
async function getKey(password,m){let base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(m.salt),iterations:m.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function reveal(key,m){let response=await fetch('deck.enc',{cache:'force-cache'});if(!response.ok)throw Error('unavailable');let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(m.iv)},key,await response.arrayBuffer());let data=new TextDecoder().decode(plain);if(!data.includes('<!DOCTYPE html>')&&!data.includes('<!doctype html>'))throw Error('invalid');document.open();document.write(data);document.close()}
async function openWithPassword(pass){const m=await loadMeta(),key=await getKey(pass,m);await reveal(key,m);try{sessionStorage.setItem('protected-deck-'+m.salt,enc(await crypto.subtle.exportKey('raw',key)))}catch(e){}}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.style.color='#5a6674';message.textContent='正在解密簡報，請稍候…';try{await openWithPassword(field.value)}catch(err){message.style.color='#9b1829';message.textContent='密碼不正確，或簡報暫時無法載入。';button.disabled=false;field.select()}});
(async()=>{try{const m=await loadMeta(),cached=sessionStorage.getItem('protected-deck-'+m.salt);if(cached){message.textContent='正在開啟簡報…';let k=await crypto.subtle.importKey('raw',dec(cached),'AES-GCM',true,['decrypt']);await reveal(k,m)}}catch(e){try{if(meta)sessionStorage.removeItem('protected-deck-'+meta.salt)}catch(_){}message.textContent='請輸入密碼。'}})();
</script></body></html>
